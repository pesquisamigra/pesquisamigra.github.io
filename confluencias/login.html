<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Confluências</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo">Confluên<span>cias</span></a>
            <nav class="main-nav">
                <a href="profissionais.html">Profissionais</a>
                <a href="index.html#artigos">Artigos</a>
                <a href="index.html#eventos">Eventos</a>
                <a href="apoie.html">Apoie</a>
            </nav>
        </div>
    </header>

    <main class="container" style="max-width:420px; padding-top:3rem; padding-bottom:3rem;">
        <div class="card">
            <h1 style="text-align:center; margin-bottom:1.5rem;">Entrar</h1>
            <form>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" placeholder="voce@email.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" placeholder="••••••••">
                </div>
                <button type="button" class="btn btn-primary" style="width:100%;" onclick="window.location.href='painel.html'">Entrar</button>
                <p style="text-align:center; margin-top:1rem;"><a href="#">Esqueci minha senha</a></p>
                <hr style="margin:1rem 0;">
                <p style="text-align:center;">Não tem conta? <a href="cadastro.html">Criar conta</a></p>
            </form>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p><strong>Confluências</strong></p>
            <div><a href="index.html">Voltar ao início</a></div>
        </div>
    </footer>
</body>
</html>
