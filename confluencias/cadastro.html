<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta — Confluências</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo">Confluên<span>cias</span></a>
            <nav class="main-nav">
                <a href="profissionais.html">Profissionais</a>
                <a href="index.html#artigos">Artigos</a>
                <a href="index.html#eventos">Eventos</a>
                <a href="apoie.html">Apoie</a>
            </nav>
        </div>
    </header>

    <main class="container" style="max-width:450px; padding-top:3rem; padding-bottom:3rem;">
        <div class="card">
            <h1 style="text-align:center; margin-bottom:1.5rem;">Criar conta</h1>
            <form>
                <div class="form-group">
                    <label>Nome completo</label>
                    <input type="text" placeholder="Seu nome">
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" placeholder="voce@email.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" placeholder="Mín. 8 caracteres">
                </div>
                <div class="form-group">
                    <label>Confirmação de senha</label>
                    <input type="password" placeholder="Repita a senha">
                </div>
                <div class="form-group checkbox">
                    <input type="checkbox" id="termos">
                    <label for="termos">Aceito os termos de uso e a política de privacidade</label>
                </div>
                <button type="button" class="btn btn-primary" style="width:100%;" onclick="window.location.href='checkout.html'">Criar conta e continuar</button>
                <p style="text-align:center; margin-top:1rem;">Já tem conta? <a href="login.html">Entrar</a></p>
            </form>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p><strong>Confluências</strong></p>
            <div><a href="index.html">Voltar ao início</a></div>
        </div>
    </footer>
</body>
</html>
