<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apoie o movimento — Confluências</title>
<link rel="stylesheet" href="assets/confluencias.css">
</head>
<body data-shell="public" data-flow="apoio"
      data-route="/apoie"
      data-screen="Contribuição voluntária e apoiadores"
      data-stories="US-012, US-026"
      data-api="POST /api/subscriptions/checkout (plano contribuição)|GET /api/supporters?public=true"
      data-states="Valor abaixo do mínimo|Pagamento recusado|Apoiador optou por anonimato|Contribuição pontual x mensal">

<section class="section-tight">
  <div class="wrap wrap-narrow">
    <span class="eyebrow">Apoie</span>
    <h1 style="font-size:2.2rem">Você não precisa de um perfil para fazer parte</h1>
    <hr class="rule-confluencia" style="margin-top:16px">
    <p class="lede">A contribuição voluntária sustenta o que não se paga sozinho: manter o diretório gratuito para quem procura atendimento, e sustentar as ações do movimento. Cada real vai para o fundo — nada fica com a plataforma.</p>
  </div>
</section>

<section style="padding-bottom:56px">
  <div class="wrap" style="max-width:900px;display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start" id="grade-apoie">

    <form class="card" data-validar data-sucesso="Contribuição registrada. Obrigado por sustentar isso.">
      <span class="eyebrow">Sua contribuição</span>
      <hr class="rule-confluencia">

      <div class="stack" style="margin-bottom:20px">
        <label class="option is-on" style="padding:16px">
          <input type="radio" name="freq" value="mensal" checked>
          <div class="option-head">
            <span><b>Todo mês</b><p class="small muted" style="margin:4px 0 0">Cobrança recorrente, cancelável a qualquer momento.</p></span>
            <span class="option-price">R$ 30</span>
          </span>
        </label>
        <label class="option" style="padding:16px">
          <input type="radio" name="freq" value="pontual">
          <div class="option-head">
            <span><b>Uma vez só</b><p class="small muted" style="margin:4px 0 0">Valor livre, a partir de R$ 30.</p></span>
            <span class="option-price small muted" style="font-family:var(--font-ui)">Você escolhe</span>
          </span>
        </label>
      </div>

      <div class="field" data-mostrar-se="pontual" hidden>
        <label class="label-req" for="valor">Quanto você quer contribuir</label>
        <input class="input" id="valor" placeholder="R$ 30,00">
        <p class="hint">Mínimo de R$ 30,00.</p>
      </div>

      <div class="field">
        <label class="label-req" for="a-nome">Nome completo</label>
        <input class="input" id="a-nome" data-erro="e-anome">
        <span class="msg-error" id="e-anome">Informe seu nome completo.</span>
      </div>

      <div class="field">
        <label class="label-req" for="a-email">E-mail</label>
        <input class="input" type="email" id="a-email" data-erro="e-aemail" data-regex="^[^@\s]+@[^@\s]+\.[^@\s]+$">
        <span class="msg-error" id="e-aemail">E-mail inválido.</span>
      </div>

      <div class="field">
        <label class="label-req" for="a-cpf">CPF ou CNPJ</label>
        <input class="input" id="a-cpf" placeholder="000.000.000-00" data-erro="e-acpf">
        <span class="msg-error" id="e-acpf">CPF/CNPJ inválido.</span>
      </div>

      <div class="field">
        <label class="label-req" for="a-metodo">Forma de pagamento</label>
        <select class="select" id="a-metodo"><option>Cartão de crédito</option><option>Pix</option><option>Boleto</option></select>
      </div>

      <label class="check">
        <input type="checkbox" id="publico" checked>
        Quero aparecer na página de apoiadores.
      </label>

      <div class="field" style="margin-top:8px">
        <label for="a-display">Nome para exibição</label>
        <input class="input" id="a-display" placeholder="Ex.: Maria S.">
        <p class="hint">Só isso aparece em público. Nunca mostramos e-mail nem valor.</p>
      </div>

      <div class="field">
        <label for="a-msg">Mensagem de apoio <span class="counter" id="cont-apoio"></span></label>
        <textarea class="textarea" id="a-msg" maxlength="500" data-contar="cont-apoio" style="min-height:80px"
          placeholder="Opcional. Pode aparecer junto ao seu nome."></textarea>
      </div>

      <label class="check">
        <input type="checkbox" id="a-termos" data-erro="e-atermos">
        Aceito os <a href="#">termos</a> e a <a href="#">política de privacidade</a>.
      </label>
      <span class="msg-error" id="e-atermos" style="margin:-8px 0 12px">É preciso aceitar os termos.</span>

      <button class="btn btn-amber btn-lg btn-block" type="submit">Contribuir</button>
    </form>

    <div class="stack">
      <div class="card">
        <span class="eyebrow">Para onde vai</span>
        <hr class="rule-confluencia">
        <div class="row-between small" style="padding:8px 0;border-bottom:1px solid var(--line-soft)">
          <span>Fundo do movimento</span><b class="mono">100%</b>
        </div>
        <div class="row-between small" style="padding:8px 0">
          <span>Plataforma</span><span class="mono muted">R$ 0,00</span>
        </div>
        <p class="hint" style="margin-top:12px">A manutenção da plataforma é bancada pelas assinaturas de perfil, não pelas contribuições.</p>
      </div>

      <div class="card">
        <span class="eyebrow">Quem já apoia</span>
        <hr class="rule-confluencia">
        <div class="stack" id="apoiadores"></div>
        <p class="hint" style="margin-top:14px">E mais 38 pessoas que preferiram não aparecer.</p>
      </div>
    </div>
  </div>
</section>

<script>
window.confPagina = function () {
  var apoiadores = [
    { n: 'Maria S.', m: 'Porque eu queria ter encontrado alguém assim quando precisei.' },
    { n: 'Coletivo Margem', m: '' },
    { n: 'Renato A.', m: 'Sigo de longe, mas sigo.' },
    { n: 'Lu', m: '' },
    { n: 'Fernanda O.', m: 'Saúde mental não devia ser privilégio.' }
  ];
  var alvo = document.getElementById('apoiadores');
  apoiadores.forEach(function (a) {
    alvo.insertAdjacentHTML('beforeend',
      '<div class="row" style="gap:12px;align-items:flex-start">' +
      '<span class="avatar avatar-sm avatar-amber">' + a.n[0] + '</span>' +
      '<span><b style="font-size:.92rem;display:block">' + a.n + '</b>' +
      (a.m ? '<span class="small muted voz">“' + a.m + '”</span>' : '') + '</span></div>');
  });

  var mq = window.matchMedia('(max-width: 860px)');
  function ajustar() {
    document.getElementById('grade-apoie').style.gridTemplateColumns = mq.matches ? '1fr' : '1fr 1fr';
  }
  mq.addEventListener('change', ajustar); ajustar();
};
</script>
<script src="assets/confluencias.js"></script>
</body>
</html>
